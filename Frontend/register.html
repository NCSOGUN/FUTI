<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account • HealthPass</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="phone">
    <a href="index.html" aria-label="Back" data-ic="back" data-s="26" style="color:var(--slate)"></a>
    
    <h1>Create your HealthPass</h1>
    <p class="muted" style="margin-bottom: 20px;">Join HealthPass to keep your health records and clinic money together.</p>
    
    <form id="reg-form">
      <label for="name">Full Name</label>
      <input class="field" id="name" type="text" placeholder="e.g. Amina Yusuf" required>

      <label for="phone">Phone Number</label>
      <input class="field" id="phone" type="tel" placeholder="e.g. 08034567821" required>

      <label for="email">Email Address</label>
      <input class="field" id="email" type="email" placeholder="you@example.com" required>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label for="dob">Date of Birth</label>
          <input class="field" id="dob" type="date" required>
        </div>
        <div style="flex: 1;">
          <label for="gender">Gender</label>
          <select class="field" id="gender" required>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <label for="pin">Create a 4-digit PIN</label>
      <input class="field" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="Enter 4-digit PIN" required>

      <p id="err" class="banner red hidden" role="alert" style="margin-top:12px"></p>
      
      <button type="submit" id="submit-btn" class="btn primary" style="margin-top:16px">Create Account</button>
    </form>
    
    <p class="muted" style="text-align:center;margin-top:16px">Already have an account? <a href="login.html">Log in here</a></p>
  </main>

  <!-- Scripts -->
  <script src="assets/js/icons.js"></script>
  <script>
    document.getElementById('reg-form').onsubmit = async function(e) {
      e.preventDefault(); // Stop page reload
      
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('err');
      
      btn.textContent = 'Creating account...';
      errEl.classList.add('hidden');
      
      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        dob: document.getElementById('dob').value,
        gender: document.getElementById('gender').value,
        pin: document.getElementById('pin').value
      };

      try {
        // Send data to the backend register route
        const res = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (res.ok && data.token) {
          // Success! Save the token and log them in automatically
          localStorage.setItem('hp_token', data.token);
          window.location.href = 'app.html';
        } else {
          // Show error (e.g. "Phone number already registered")
          throw new Error(data.message || 'Registration failed');
        }
      } catch (error) {
        errEl.textContent = error.message;
        errEl.classList.remove('hidden');
        btn.textContent = 'Create Account';
      }
    };
  </script>
</body>
</html>
