<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard • HealthPass</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    body { background: #f1f5f9; display: flex; height: 100vh; margin: 0; font-family: system-ui, sans-serif; }
    .sidebar { width: 260px; background: #0f172a; color: #fff; padding: 24px 16px; display: flex; flex-direction: column; }
    .brand { font-size: 20px; font-weight: bold; color: #2dd4bf; margin-bottom: 32px; padding-left: 8px; }
    .sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-weight: 500; transition: 0.2s; }
    .sidebar a:hover { background: #1e293b; color: #fff; }
    .sidebar a.active { background: #2dd4bf; color: #0f172a; font-weight: 700; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .content { padding: 32px; overflow-y: auto; flex: 1; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="brand">HealthPass Admin</div>
    <a href="#overview" class="active"><span data-ic="grid"></span> Overview</a>
    <a href="#clinics"><span data-ic="hospital"></span> Clinics</a>
    <a href="#patients"><span data-ic="heart"></span> Patients</a>
    <a href="#accounts"><span data-ic="users"></span> Accounts</a>
    <a href="#ai-governance"><span data-ic="shield"></span> AI Governance</a>
    
    <div style="margin-top: auto;">
      <button class="btn" id="logout" style="width: 100%; background: #1e293b; border: none; color: #fff;">Log out</button>
    </div>
  </nav>

  <main class="main">
    <header class="topbar">
      <h2 style="margin: 0; font-size: 18px; color: #0f172a;">System Overview</h2>
    </header>
    <div class="content" id="view"></div>
  </main>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
