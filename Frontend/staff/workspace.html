<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff Workspace • HealthPass</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    body { background: #f8fafc; display: flex; height: 100vh; margin: 0; font-family: system-ui, sans-serif; }
    .sidebar { width: 260px; background: #0f172a; color: #fff; padding: 24px 16px; display: flex; flex-direction: column; }
    .brand { font-size: 22px; font-weight: bold; color: #2dd4bf; margin-bottom: 32px; padding-left: 8px; }
    .clinic-name { font-size: 14px; color: #94a3b8; margin-bottom: 24px; padding-left: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .sidebar a { display: block; padding: 12px; color: #cbd5e1; text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-size: 15px; transition: 0.2s; }
    .sidebar a:hover { background: #1e293b; color: #fff; }
    .sidebar a.active { background: #2dd4bf; color: #0f172a; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .content { padding: 32px; overflow-y: auto; flex: 1; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .stat-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .stat-card h1 { font-size: 36px; margin: 10px 0 0 0; color: #0f172a; }
    .stat-card p { margin: 0; color: #64748b; font-weight: 500; font-size: 15px; }
    .chat-container { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; height: 500px; display: flex; flex-direction: column; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg-user { background: #0ea5e9; color: #fff; padding: 12px 16px; border-radius: 12px 12px 0 12px; align-self: flex-end; max-width: 80%; }
    .msg-ai { background: #f1f5f9; color: #0f172a; padding: 12px 16px; border-radius: 12px 12px 12px 0; align-self: flex-start; max-width: 80%; }
    .chat-input { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #e2e8f0; }
    .chat-input input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .table th { background: #f8fafc; padding: 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #475569; }
    .table td { padding: 16px; border-bottom: 1px solid #e2e8f0; color: #334155; }
    .btn-primary { background: #0ea5e9; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-primary:hover { background: #0284c7; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="brand">HealthPass</div>
    <div class="clinic-name">Rural PHC</div>
    <a href="#dashboard" class="active" onclick="switchTab('dashboard')">Dashboard</a>
    <a href="#ai-consultant" onclick="switchTab('ai-consultant')">AI Consultant</a>
    <a href="#inventory" onclick="switchTab('inventory')">Inventory</a>
    <a href="scanner.html" style="color: #2dd4bf; font-weight: bold; margin-top: 20px;">📷 Scan Patient QR</a>
    <div style="margin-top: auto;"><button class="btn-primary" style="width: 100%; background: #1e293b;" onclick="localStorage.removeItem('token'); location.href='index.html'">Log out</button></div>
  </nav>

  <main class="main">
    <header class="topbar"><h2 style="margin:0; font-size:18px; color:#0f172a;">Staff Workspace</h2><span style="color:#64748b;">Funke Okafor</span></header>
    <div class="content" id="view"></div>
  </main>

  <!-- Add Item Modal -->
  <div id="add-item-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.7); z-index:1000; align-items:center; justify-content:center;">
    <div style="width: 400px; padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
      <h2 style="margin-top:0; color:#0f172a;">Add Medicine</h2>
      
      <label style="font-weight:600; font-size:14px; color:#475569;">Medicine Name</label>
      <input class="field" id="inv-name" placeholder="e.g. Paracetamol 500mg" style="width:100%; padding:12px; margin-top:8px; margin-bottom:16px; border:1px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
      
      <label style="font-weight:600; font-size:14px; color:#475569;">Batch Number</label>
      <input class="field" id="inv-batch" placeholder="e.g. BTH-123" style="width:100%; padding:12px; margin-top:8px; margin-bottom:16px; border:1px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
      
      <!-- NEW QUANTITY FIELD -->
      <label style="font-weight:600; font-size:14px; color:#475569;">Quantity</label>
      <input class="field" id="inv-qty" type="number" placeholder="e.g. 100" style="width:100%; padding:12px; margin-top:8px; margin-bottom:16px; border:1px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">

      <label style="font-weight:600; font-size:14px; color:#475569;">Expiry Date</label>
      <input class="field" id="inv-expiry" type="date" style="width:100%; padding:12px; margin-top:8px; margin-bottom:24px; border:1px solid #cbd5e1; border-radius:8px; box-sizing:border-box;">
      
      <div style="display: flex; gap: 12px;">
        <button class="btn-primary" onclick="saveItem()" style="flex: 1;">Save Item</button>
        <button class="btn-primary" style="flex: 1; background:#e2e8f0; color:#0f172a;" onclick="document.getElementById('add-item-modal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('token')) location.replace('index.html');
    
    function switchTab(tab) {
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      document.querySelector(`.sidebar a[href="#${tab}"]`).classList.add('active');
      const view = document.getElementById('view');
      
      if (tab === 'dashboard') {
        view.innerHTML = `
          <div class="head"><h1>Welcome back, Funke</h1><p class="muted">Here is your clinic overview for today.</p></div>
          <div class="grid3">
            <div class="stat-card"><p>Patients Today</p><h1>12</h1></div>
            <div class="stat-card"><p>Pending Tasks</p><h1>3</h1></div>
            <div class="stat-card"><p>Low Stock Alerts</p><h1 style="color: #ef4444;">2</h1></div>
          </div>
        `;
      } 
      else if (tab === 'ai-consultant') {
        view.innerHTML = `
          <div class="head"><h1>AI Consultant</h1><p class="muted">Get clinical decision support.</p></div>
          <div class="chat-container">
            <div id="chat-box">
              <div class="msg-ai">Hello! I am your AI Consultant. How can I assist you today?</div>
            </div>
            <div class="chat-input">
              <input id="ai-input" placeholder="Ask a clinical question..." onkeypress="if(event.key === 'Enter') sendAIMessage()">
              <button class="btn-primary" onclick="sendAIMessage()">Send</button>
            </div>
          </div>
        `;
      } 
      else if (tab === 'inventory') {
        view.innerHTML = `
          <div class="head" style="display: flex; justify-content: space-between; align-items: center;">
            <div><h1>Inventory</h1><p class="muted">Clinic stock and medicine tracking.</p></div>
            <button class="btn-primary" onclick="document.getElementById('add-item-modal').style.display='flex'">+ Add Item</button>
          </div>
          <table class="table" id="inventory-table">
            <tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Status</th></tr>
          </table>
        `;
        loadInventory();
      }
    }

    async function loadInventory() {
      const table = document.getElementById('inventory-table');
      table.innerHTML = `<tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Status</th></tr><tr><td colspan="5" class="muted">Loading stock...</td></tr>`;

      try {
        const res = await fetch('http://localhost:5000/api/inventory/items', {
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        
        if (data && data.length > 0) {
          table.innerHTML = `<tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Status</th></tr>`;
          data.forEach(item => {
            const statusHtml = item.stock > 20 
              ? `<span style="background:#dcfce7; padding:4px 8px; border-radius:4px; color:#166534;">OK</span>`
              : `<span style="background:#fef9c3; padding:4px 8px; border-radius:4px; color:#854d0e;">Low Stock</span>`;

            table.innerHTML += `
              <tr>
                <td><b>${item.name}</b></td>
                <td>BTH-${item.sku ? item.sku.slice(-4).toUpperCase() : '001'}</td>
                <td>${item.earliestExpiry ? new Date(item.earliestExpiry).toLocaleDateString() : 'N/A'}</td>
                <td>${item.stock}</td>
                <td>${statusHtml}</td>
              </tr>
            `;
          });
        } else {
          table.innerHTML += `<tr><td colspan="5" class="muted">No inventory items found. Click "+ Add Item" to start.</td></tr>`;
        }
      } catch (e) {
        table.innerHTML += `<tr><td colspan="5" class="muted" style="color:red;">Failed to load inventory.</td></tr>`;
      }
    }

    async function saveItem() {
      const name = document.getElementById('inv-name').value;
      const batch = document.getElementById('inv-batch').value;
      const qty = document.getElementById('inv-qty').value;
      const expiry = document.getElementById('inv-expiry').value;
      
      if(!name || !batch || !qty) return alert('Please fill name, batch, and quantity.');
      
      try {
        const res = await fetch('http://localhost:5000/api/inventory', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
          body: JSON.stringify({ name, batch, quantity: Number(qty), expiry })
        });
        
        if(res.ok) {
          alert('Item saved successfully!');
          document.getElementById('add-item-modal').style.display='none';
          document.getElementById('inv-name').value = '';
          document.getElementById('inv-batch').value = '';
          document.getElementById('inv-qty').value = '';
          loadInventory(); // Refresh the table
        } else {
          const err = await res.json();
          alert('Error: ' + err.message);
        }
      } catch (e) { alert('Network error saving item'); }
    }

    async function sendAIMessage() {
      const input = document.getElementById('ai-input');
      const msg = input.value.trim();
      if (!msg) return;
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div class="msg-user">${msg}</div>`;
      input.value = '';
      
      const loadingId = 'load-' + Date.now();
      chatBox.innerHTML += `<div id="${loadingId}" style="color:#64748b; font-size:12px;">AI is thinking...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('http://localhost:5000/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        document.getElementById(loadingId).remove();
        if (data.answer) chatBox.innerHTML += `<div class="msg-ai">${data.answer}</div>`;
        else chatBox.innerHTML += `<div class="msg-ai" style="color: red;">Error: ${data.message}</div>`;
      } catch (e) {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="msg-ai" style="color: red;">Connection error.</div>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    switchTab('dashboard');
  </script>
</body>
</html>
